entries:
- id: call_general
  weight: '0.6'
  text: 'Temsilci: Iyi gunler, size nasil yardimci olabilirim? Musteri: {entity:PERSON} ben ariyorum,
    policemle ilgili bir sorum var. Temsilci: Kimlik dogrulamasi icin {id:TCKN} numaranizin son haneleri
    dogru mu? Musteri: Evet. Adresim {entity:ADDRESS}, telefonum {id:PHONE}. Temsilci: Policeniz (aktif|yenileme
    asamasinda) gorunuyor. Musteri: (Yenileme|Hasar durumu|Iptal) icin aramistim. [?0.5: Temsilci: Odeme
    icin {id:IBAN} hesabinizi kullanabiliriz; eposta adresiniz {id:EMAIL} olarak kayitli.] Temsilci: Talebinizi
    kaydettim, en kisa surede donus yapilacaktir.'
