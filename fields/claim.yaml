schema_version: 1
type_name: claim
id_prefix: CLM
order: 3
fields:
  - {name: claim_id, type: str, generator: seq_id, pii_label: none}
  - name: policy_id
    type: ref
    generator: seq_id
    ref: {parent: policy, counts: [0, 1, 2], weights: ["0.80", "0.16", "0.04"]}
    pii_label: none
  - {name: event_date, type: date, generator: datetime_window, pii_label: none}
  - {name: report_date, type: date, generator: "derived:date_offset", params: {source: event_date, days: 7}, pii_label: none}
  - {name: amount_claimed_kurus, type: int, generator: "int_lognormal_table:txn_amounts", pii_label: none}
  - {name: amount_paid_kurus, type: int, generator: "derived:ratio_of", params: {source: amount_claimed_kurus, numerator: 78, denominator: 100}, pii_label: none}
  - name: status
    type: enum
    generator: enum_weighted
    params:
      values: [odendi, incelemede, reddedildi, eksik_evrak]
      weights: ["0.55", "0.20", "0.15", "0.10"]
    pii_label: none
  - {name: assessor_name, type: str, generator: "lexicon:surnames_tr", pii_label: PERSON}
  - name: anomaly_kind
    type: enum
    generator: enum_weighted
    params:
      values: [none, erken_hasar, mukerrer_talep, tutar_sapmasi, siklik_artisi]
      weights: ["0.92", "0.03", "0.02", "0.02", "0.01"]
    pii_label: none
  - {name: is_anomaly, type: str, generator: "derived:flag_unless", params: {source: anomaly_kind, value: none}, pii_label: none}
