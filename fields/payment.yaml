schema_version: 1
type_name: payment
id_prefix: PAY
order: 4
fields:
  - {name: payment_id, type: str, generator: seq_id, pii_label: none}
  - name: policy_id
    type: ref
    generator: seq_id
    ref: {parent: policy, counts: [1, 3, 12], weights: ["0.35", "0.25", "0.40"]}
    pii_label: none
  - {name: due_date, type: date, generator: datetime_window, pii_label: none}
  - {name: paid_date, type: date, generator: "derived:date_offset", params: {source: due_date, days: 3}, nullable: true, null_rate: "0.07", pii_label: none}
  - {name: amount_kurus, type: int, generator: "int_lognormal_table:txn_amounts", pii_label: none}
  - name: method
    type: enum
    generator: enum_weighted
    params: {values: [kredi_karti, havale, otomatik_odeme], weights: ["0.55", "0.25", "0.20"]}
    pii_label: none
  - {name: pan_masked, type: str, generator: "identifier:PAN", nullable: true, null_rate: "0.45", pii_label: PAN}
  - {name: payer_iban, type: str, generator: "identifier:IBAN", nullable: true, null_rate: "0.75", pii_label: IBAN}
