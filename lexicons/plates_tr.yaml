name: plates_tr
source_note: 'Vehicle plates. The two-digit province code is factual reference data: the standard
  01 to 81 assignment, stable since the creation of Duzce in 1999, retrieved 2026-08-22. The letters
  and digits after it are invented and follow no real registration series. Emitted unlabeled:
  the pinned taxonomy has no PLATE label.'
